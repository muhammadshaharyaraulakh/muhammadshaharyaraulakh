name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: muhammadshaharyaraulakh
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff4500&color_dots=#0d1117,#ff6a00,#ff4500,#cc3700,#992900
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ff4500&color_dots=#0d1117,#ff6a00,#ff4500,#cc3700,#992900

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
